{% extends "index.html" %}
{% load i18n %}
{% block content %}
<div class="oh-wrapper d-flex justify-content-center" style="padding-top:4rem"><div class="oh-card" style="max-width:560px;width:100%"><h2 class="oh-inner-sidebar-content__title">{% trans "Confirm delete" %}</h2><p class="mt-3">Are you sure you want to delete <strong>{{ object }}</strong>?</p><form method="post" class="d-flex justify-content-end gap-2 mt-4">{% csrf_token %}<a href="{% url 'website-manage-list' section %}" class="oh-btn oh-btn--light">{% trans "Cancel" %}</a><button class="oh-btn oh-btn--danger" type="submit">{% trans "Delete" %}</button></form></div></div>
{% endblock %}
