<section class="cms-section stats-section" aria-labelledby="section-{{ section.id }}"><div class="container"><header class="section-head"><span class="section-kicker">Impact</span><h2 id="section-{{ section.id }}">{{ section.heading }}</h2><p>{{ section.subheading }}</p></header><div class="stats-grid">{% for item in section.section_items.all %}{% if item.is_active %}<article class="stat-card"><strong>{{ item.value }}</strong><h3>{{ item.title }}</h3><p>{{ item.description }}</p></article>{% endif %}{% endfor %}</div></div></section>
